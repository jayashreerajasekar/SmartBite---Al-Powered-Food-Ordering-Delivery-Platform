{% extends "base.html" %}
{% block content %}
<div class="container rsb-auth-container">
    <div class="rsb-auth-card">
        <h2>Create your account</h2>
        <p class="text-muted">Join RIN'S SMART BITE today</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" pattern="[0-9]{10}" placeholder="10-digit number">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required minlength="4">
            </div>
            <button type="submit" class="rsb-btn rsb-btn-primary w-100">Create Account</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
