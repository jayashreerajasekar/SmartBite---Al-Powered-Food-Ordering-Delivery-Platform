{% extends "base.html" %}
{% block content %}
<div class="container rsb-section">
    <div class="rsb-checkout-steps">
        <span class="active">1. Address</span> &rarr;
        <span>2. Payment</span> &rarr;
        <span>3. Confirmation</span>
    </div>

    <h2 class="rsb-section-title">Select Delivery Address</h2>

    <div class="row">
        <div class="col-lg-7">
            {% for addr in addresses %}
            <label class="rsb-address-card">
                <input type="radio" name="address_id" value="{{ addr['id'] }}" form="addressSelectForm" {{ 'checked' if loop.first }}>
                <div>
                    <span class="badge bg-secondary">{{ addr['address_type'] }}</span>
                    <h6>{{ addr['full_name'] }} &middot; {{ addr['phone'] }}</h6>
                    <p class="text-muted mb-0">{{ addr['house_no'] }}, {{ addr['street'] }}, {{ addr['area'] }}, {{ addr['city'] }}, {{ addr['state'] }} - {{ addr['pincode'] }}</p>
                    {% if addr['landmark'] %}<p class="text-muted small mb-0">Landmark: {{ addr['landmark'] }}</p>{% endif %}
                </div>
                <form method="post" action="{{ url_for('delete_address', address_id=addr['id']) }}">
                    <button type="submit" class="rsb-remove-link">Delete</button>
                </form>
            </label>
            {% else %}
            <p class="text-muted">You have no saved addresses yet. Add one below.</p>
            {% endfor %}

            <form id="addressSelectForm" method="get" action="{{ url_for('payment_page') }}" class="mt-3">
                <button type="submit" class="rsb-btn rsb-btn-primary" {{ 'disabled' if not addresses }}>Continue to Payment &rarr;</button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="rsb-summary-card">
                <h5>Add New Address</h5>
                <form method="post" action="{{ url_for('add_address') }}">
                    <div class="mb-2">
                        <select name="address_type" class="form-select">
                            <option value="HOME">HOME</option>
                            <option value="WORK">WORK</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="mb-2"><input type="text" name="full_name" class="form-control" placeholder="Full Name" required value="{{ current_user['name'] if current_user }}"></div>
                    <div class="mb-2"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required value="{{ current_user['phone'] if current_user }}"></div>
                    <div class="mb-2"><input type="text" name="house_no" class="form-control" placeholder="House / Flat No." required></div>
                    <div class="mb-2"><input type="text" name="street" class="form-control" placeholder="Street" required></div>
                    <div class="mb-2"><input type="text" name="area" class="form-control" placeholder="Area" required></div>
                    <div class="row">
                        <div class="col-6 mb-2"><input type="text" name="city" class="form-control" placeholder="City" required value="Coimbatore"></div>
                        <div class="col-6 mb-2"><input type="text" name="state" class="form-control" placeholder="State" required value="Tamil Nadu"></div>
                    </div>
                    <div class="mb-2"><input type="text" name="pincode" class="form-control" placeholder="PIN Code" required pattern="[0-9]{6}"></div>
                    <div class="mb-2"><input type="text" name="landmark" class="form-control" placeholder="Landmark (optional)"></div>
                    <button type="submit" class="rsb-btn rsb-btn-outline w-100">Save Address</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
